<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>PS5 Altyazı TV</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head>
<body>
  <main id="setup">
    <h1>PS5 Altyazı</h1><p id="platformStatus">TVWindow başlatılıyor…</p>
    <div class="controls"><label for="hdmiSelect">PS5'in bağlı olduğu HDMI</label><select id="hdmiSelect"></select><button id="startHdmi">HDMI görüntüsünü göster</button></div>
    <div class="controls"><label for="tabletIp">Tablet IP adresi</label><input id="tabletIp" type="text" value="192.168.1.8"><label for="tabletPort">Port</label><input id="tabletPort" type="number" value="8787"><button id="connect">Tablete bağlan</button></div>
    <p id="connectionStatus">Bağlantı bekleniyor</p><button id="hidePanel" class="secondary">Paneli gizle</button>
  </main>
  <button id="showPanel" class="panel-toggle">Ayarlar</button><section id="subtitle" aria-live="polite"></section>
</body></html>
