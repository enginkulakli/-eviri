
name: PS5 Altyazi APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle 8.2 kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: APK derle
        working-directory: Ps5AltyaziApp
        run: gradle assembleDebug --no-daemon

      - name: APK dosyasını hazırla
        uses: actions/upload-artifact@v4
        with:
          name: Ps5Altyazi-debug-apk
          path: Ps5AltyaziApp/app/build/outputs/apk/debug/app-debug.apk
